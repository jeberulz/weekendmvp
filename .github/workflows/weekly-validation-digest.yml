name: Weekly validation digest

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GA4_PROPERTY_ID: "517826359"
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      VALIDATION_REPORT_EMAIL_FROM: ${{ secrets.VALIDATION_REPORT_EMAIL_FROM }}
      VALIDATION_REPORT_EMAIL_TO: ${{ secrets.VALIDATION_REPORT_EMAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate and email digest
        run: npm run validation:digest -- --email --stdout

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-validation-digest
          path: reports/validation/*.md
          if-no-files-found: warn
          retention-days: 30
