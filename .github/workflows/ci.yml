name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: `test:redirects`, `test:sitemap`, and `test:security`
      # run `node --experimental-strip-types`, which was added in 22.6 and does
      # not exist in 20 — on 20 they die with `node: bad option`.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and accessibility rules
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate idea tagging contract
        run: npm run validate:idea-tags

      - name: Audit idea page structure
        run: npm run audit:idea -- --all

      - name: Build
        run: npm run build
