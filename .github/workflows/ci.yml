name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS patched release (CVE-2026-111497 / Oct 2026 security
      # releases). `test:redirects`, `test:sitemap`, and `test:security` need
      # `--experimental-strip-types` (Node >= 22.6). Pin the patch, not `22.x`,
      # so CI cannot land on an unpatched 22 build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and accessibility rules
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate idea tags
        run: npm run validate:idea-tags

      - name: Build
        run: npm run build

      - name: Check server artifacts
        run: npm run check:server-traces
