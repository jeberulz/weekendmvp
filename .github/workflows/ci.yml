name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node 24 LTS patched release (CVE-2026-111497 / Oct 2026 security
      # releases). Pin the patch, not `24.x`, so CI cannot land on an
      # unpatched 24 build. Matches package.json engines `24.x` + .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and accessibility rules
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate idea tags
        run: npm run validate:idea-tags

      - name: Build
        run: npm run build

      - name: Check server artifacts
        run: npm run check:server-traces
