name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Was `check-links`, which ran three scripts that have never existed in
  # package.json (`check:links`, `check:stylesheets`, `check:all-nav`) —
  # leftovers from the pre-Next.js static site. The job failed at its first
  # step on every PR and every push to main, so CI has never passed.
  #
  # These are the checks `.agentic-workflow.yml` already declares as required,
  # ordered cheapest-first so a type error fails in seconds rather than after
  # a full build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
