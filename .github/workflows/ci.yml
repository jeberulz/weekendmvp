name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Depth 2 so HEAD^1 exists: the PR base tip on pull_request (merge
      # commit), the previous main commit on push. The idea quality gate
      # diffs against it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Node 22, not 20: `test:redirects`, `test:sitemap`, and `test:security`
      # run `node --experimental-strip-types`, which was added in 22.6 and does
      # not exist in 20 — on 20 they die with `node: bad option`.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and accessibility rules
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate idea tags
        run: npm run validate:idea-tags

      # Blocks new or edited idea pages that fail Layer 0 (structure, slop,
      # placeholders, source hygiene, duplication). Existing pages are
      # report-only: see evals/results/report.md.
      - name: Idea content quality gate (changed pages)
        run: npm run evals:changed -- --base HEAD^1

      - name: Build
        run: npm run build
