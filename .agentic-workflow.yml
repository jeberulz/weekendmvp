version: 1
project_name: Weekend MVP

truth_docs:
  - AGENTS.md
  - AGENTS.workflow.md
  - docs/wp/RULINGS.md
  - docs/wp/program-platform-plan.md
  - docs/wp/program-manifest.md
  - docs/wp/platform-ux-brief.md
  - docs/design/signed-in-home.md
  - docs/design/signed-in-library.md
  - docs/design/preview.md
  - docs/design/publish.md
  - docs/PROJECT_STRATEGY.md
  - README.md

work_package:
  registry: docs/PROJECT_STRATEGY.md
  directory: docs/wp
  branch_prefix: codex/
  story_template: docs/wp/templates/wp-stories-template.md
  progress_template: docs/wp/templates/wp-progress-template.md

program:
  manifest: docs/wp/program-manifest.md
  session_ledger: docs/wp/session-ledger.md
  wave_gate_report: docs/wp/wave-gate-report.md
  backup_restore: docs/wp/backup-restore.md
  audit_first: true
  manifest_is_source_of_truth: true
  workers_may_rescope: false
  unknown_means_stop: true
  irreversible_requires:
    - restore_marker
    - backup_inventory
    - dry_run_inventory
    - owner_approval
    - post_run_verification
  default_waves:
    - audit_manifest
    - reversible_docs_tests_tooling
    - reversible_code
    - data_touching_code
    - production_data_mutation
    - schema_narrowing_or_irreversible_cleanup
    - docs_agent_knowledge_closeout

small_fix:
  max_files: 2
  disallowed:
    - schema
    - auth
    - billing
    - publishing
    - prompts
    - dependencies
    - migrations
    - shared_contracts
    - ux_redesign

worktrees:
  default: false
  root: .worktrees
  allowed_when:
    - parallel_work_packages
    - gate_run
    - risky_isolated_experiment
  never_create_sibling_folders: true
  cleanup_required: true

orchestration:
  default: single_agent
  use_subagents_when:
    - parallel_work_packages
    - independent_review
    - gate_run
    - context_isolation_needed
  roles:
    orchestrator:
      writes_code: false
      owns:
        - planning
        - file_boundaries
        - sequencing
        - rulings
        - gate_assignments
    worker:
      scope: one_wp_or_story
      writes_code: true
      cannot:
        - make_product_rulings
        - expand_file_boundaries
    reviewer:
      writes_code: false
      output_order: findings_first
    gate_runner:
      writes_code: false
      owns:
        - checks
        - critical_flows
        - scoped_failure_report

model_routing:
  principle: route_by_risk_not_size
  high:
    - orchestrator
    - architecture
    - security_auth_payments_publishing
    - production_data
    - migrations
    - ai_prompt_behavior
    - final_review
  mid:
    - standard_wp
    - focused_ui
    - tests
    - documented_integrations
    - contained_refactor
  low:
    - story_scaffolding
    - inventory
    - docs_cleanup
    - run_checks
    - mechanical_lint_fixes
  escalate_when:
    - repeated_failure
    - ambiguous_scope
    - product_decision_needed
    - risk_increased

required_checks:
  wave0_docs:
    - git diff --check
    - yaml_parse_agentic_workflow
    - independent_manifest_review
  standard:
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
  small_fix:
    - npm test
  gate:
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build

critical_flows:
  - public_idea_page_remains_crawlable_and_canonical
  - anonymous_user_cannot_read_or_mutate_private_project_data
  - magic_link_and_google_signup_login_logout
  - repository_idea_to_anonymous_preview_to_signup
  - stripe_checkout_webhook_credits_exactly_once
  - confirmed_brief_to_preview_to_paid_publish
  - tenant_host_resolves_only_its_published_site
  - failed_credit_task_refunds_exactly_once
  - public_content_publishing_runs_without_ideabrowser
  - anonymous_and_customer_accounts_cannot_access_super_admin_or_editorial_workflows
  - canonical_content_publish_requires_admin_approval_preview_deploy_health_check_then_activation

permanent_guardrails:
  - public_idea_pages_are_the_only_canonical_idea_research_pages
  - private_platform_and_preview_routes_are_noindex
  - every_private_convex_function_derives_identity_server_side
  - credits_and_money_change_only_from_server_verified_events
  - legacy_shipable_billing_and_platform_credit_billing_are_namespaced
  - middleware_or_proxy_and_convex_schema_have_one_writer_per_merge_window
  - tenant_publish_requires_policy_gate_and_owner_scoped_site_config
  - no_secret_values_in_git_logs_docs_or_client_bundles
  - production_mutation_requires_backup_dry_run_and_owner_approval
  - ideabrowser_dependency_removed_only_after_quality_gates_pass
  - idea_engine_editorial_queues_and_canonical_content_publishing_are_super_admin_only
  - super_admin_is_server_verified_audited_and_never_a_generic_cross_owner_bypass
